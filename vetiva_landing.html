document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        let finalBytes;
        if (entry.url) {
          // Externalized asset — fetch the real file instead of inline base64.
          // Loads in parallel with the other assets and is cacheable across visits.
          const resp = await fetch(entry.url);
          finalBytes = new Uint8Array(await resp.arrayBuffer());
        } else {
          const binaryStr = atob(entry.data);
          const bytes = new Uint8Array(binaryStr.length);
          for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

          finalBytes = bytes;
          if (entry.compressed) {
            if (typeof DecompressionStream !== 'undefined') {
              const ds = new DecompressionStream('gzip');
              const writer = ds.writable.getWriter();
              const reader = ds.readable.getReader();
              writer.write(bytes);
              writer.close();
              const chunks = [];
              let totalLen = 0;
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                totalLen += value.length;
              }
              finalBytes = new Uint8Array(totalLen);
              let offset = 0;
              for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
            } else {
              console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
            }
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.url ? toBase64(finalBytes) : (entry.compressed ? toBase64(finalBytes) : entry.data));
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2Fp>\n        <ul style=\"list-style:none; padding:0; margin:16px 0 0; display:flex; flex-direction:column; gap:10px;\">\n          <li style=\"display:flex; gap:9px; font-size:13.5px; line-height:1.5; color:var(--ink);\"><span style=\"color:var(--gold-dark); font-weight:700; flex-shrink:0;\">✓<\u002Fspan>A 5-day beginner series — what investing is and how it works in Nigeria, in clear, everyday language.<\u002Fli>\n          <li style=\"display:flex; gap:9px; font-size:13.5px; line-height:1.5; color:var(--ink);\"><span style=\"color:var(--gold-dark); font-weight:700; flex-shrink:0;\">✓<\u002Fspan>The \"How to Recognise a Legitimate Investment Platform\" checklist — protect your money from fraudulent schemes.<\u002Fli>\n          <li style=\"display:flex; gap:9px; font-size:13.5px; line-height:1.5; color:var(--ink);\"><span style=\"color:var(--gold-dark); font-weight:700; flex-shrink:0;\">✓<\u002Fspan>Early access — be among the first to know when new opportunities open on Vetiva Invest.<\u002Fli>\n        <\u002Ful>\n        <div style=\"display:flex; flex-direction:column; gap:12px; margin-top:20px;\">\n          <label style=\"display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:700; color:var(--brand);\">Email address\n            <input type=\"email\" value=\"{{ popupEmail }}\" sc-camel-on-change=\"{{ popupSetEmail }}\" placeholder=\"you@example.com\" style=\"font-family:var(--fb); font-size:14.5px; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; color:var(--ink); outline:none; width:100%;\">\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:700; color:var(--brand);\">Phone number\n            <input type=\"tel\" value=\"{{ popupPhone }}\" sc-camel-on-change=\"{{ popupSetPhone }}\" placeholder=\"0801 234 5678\" style=\"font-family:var(--fb); font-size:14.5px; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; color:var(--ink); outline:none; width:100%;\">\n          <\u002Flabel>\n          <sc-if value=\"{{ popupError }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0; font-size:12.5px; color:#a4392e; font-weight:600;\">{{ popupErrorText }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px; margin-top:18px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ popupSubmit }}\" style=\"font-family:var(--fb); font-weight:700; font-size:15px; padding:15px; border-radius:12px; background:var(--gold); color:#161B14; border:0; cursor:pointer;\">Send me the free guide<\u002Fbutton>\n          <a href=\"#start\" sc-camel-on-click=\"{{ popupCtaClick }}\" style=\"display:flex; justify-content:center; background:var(--paper); color:var(--brand); font-family:var(--fb); font-weight:700; font-size:14.5px; padding:13px; border-radius:12px; border:1.5px solid var(--brand);\" style-hover=\"background:var(--green-tint);\">Get started — it's free<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ popupDoneVisible }}\" hint-placeholder-val=\"{{ false }}\">\n        <h3 style=\"font-weight:700; font-size:23px; line-height:1.15; color:var(--brand); padding-right:28px;\">Check your inbox<\u002Fh3>\n        <p style=\"font-size:14px; line-height:1.6; margin:14px 0 0; color:var(--muted);\">Your first lesson and the \"How to Recognise a Legitimate Investment Platform\" checklist are on their way. You are also on our early-access list — you will be among the first to know when new opportunities open on Vetiva Invest. Ready now? Your sign-up takes about 3 minutes.<\u002Fp>\n        <a href=\"#start\" sc-camel-on-click=\"{{ popupCtaClick }}\" style=\"display:flex; justify-content:center; margin-top:20px; background:var(--gold); color:#161B14; font-family:var(--fb); font-weight:700; font-size:15px; padding:14px; border-radius:12px;\" style-hover=\"background:var(--gold-light);\">Get started<\u002Fa>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== STICKY MOBILE CTA ===== -->\n<sc-if value=\"{{ showStickyCta }}\" hint-placeholder-val=\"{{ true }}\">\n  <button type=\"button\" class=\"v-guide-pill\" sc-camel-on-click=\"{{ popupReopen }}\" aria-label=\"Free investing guide\" style=\"position:fixed; right:20px; bottom:20px; z-index:60; display:inline-flex; align-items:center; gap:8px; background:var(--brand); color:#fff; font-family:var(--fb); font-weight:700; font-size:13.5px; padding:12px 18px; border-radius:999px; border:1.5px solid color-mix(in srgb,var(--gold) 55%,transparent); cursor:pointer; box-shadow:0 12px 30px -10px rgba(0,0,0,0.45);\"><span style=\"color:var(--gold-light);\">✉<\u002Fspan>Free investment guide<\u002Fbutton>\n  <div data-vt-sticky=\"\" style=\"position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--paper); border-top:1px solid var(--line); padding:12px 16px; display:none; align-items:center; gap:12px; box-shadow:0 -8px 24px rgba(35,37,27,0.1);\">\n    <div style=\"flex:1; min-width:0;\">\n      <div style=\"font-family:var(--fh); font-weight:600; font-size:15px; color:var(--brand);\">Invest with Vetiva<\u002Fdiv>\n      <div style=\"font-size:11px; color:var(--muted);\">Free to open · shares in your name<\u002Fdiv>\n    <\u002Fdiv>\n    <a href=\"#start\" style=\"background:var(--gold); color:#161B14; font-family:var(--fb); font-weight:700; font-size:14.5px; padding:12px 20px; border-radius:10px; white-space:nowrap;\">Get started<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900},&quot;ctaHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://client.vetiva.com/&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;loginHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://client.vetiva.com/&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;showStickyCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nclass Component extends DCLogic {\n  state = { playing: false, subType: 'Individual', openFaq: 0, dealPage: 0, popupState: 'closed', popupEmail: '', popupPhone: '', popupError: '' };\n\n  componentDidMount() {\n    this._dealTimer = setInterval(() => {\n      this.setState(s => ({ dealPage: s.dealPage === 0 ? 1 : 0 }));\n    }, 5000);\n    this._initPopup();\n  }\n  componentWillUnmount() {\n    clearInterval(this._dealTimer);\n    (this._popupCleanups || []).forEach(fn => fn());\n  }\n\n  _popupEligible() {\n    try {\n      if (localStorage.getItem('vetiva_cta_clicked')) return false;\n      const seen = localStorage.getItem('vetiva_popup_seen');\n      if (seen && Date.now() - Number(seen) < 7 * 24 * 60 * 60 * 1000) return false;\n      return true;\n    } catch (e) { return true; }\n  }\n\n  _openPopup(force) {\n    if (!force && (this._popupShown || !this._popupEligible())) return;\n    if (this.state.popupState !== 'closed') return;\n    this._popupShown = true;\n    this.setState({ popupState: 'form' });\n    setTimeout(() => {\n      const card = document.querySelector('[data-vt-popup]');\n      const inp = card && card.querySelector('input');\n      if (inp) inp.focus();\n    }, 60);\n  }\n\n  _markSeen() { try { localStorage.setItem('vetiva_popup_seen', String(Date.now())); } catch (e) {} }\n\n  _initPopup() {\n    this._popupCleanups = [];\n    const on = (target, ev, fn, opts) => { target.addEventListener(ev, fn, opts); this._popupCleanups.push(() => target.removeEventListener(ev, fn, opts)); };\n    // mark vetiva_cta_clicked on any existing Get started CTA (links to #start)\n    on(document, 'click', (e) => {\n      const a = e.target.closest && e.target.closest('a[href=\"#start\"]');\n      if (a && !a.closest('[data-vt-popup]')) { try { localStorage.setItem('vetiva_cta_clicked', '1'); } catch (err) {} }\n    }, true);\n    // Escape closes\n    on(document, 'keydown', (e) => {\n      if (this.state.popupState === 'closed') return;\n      if (e.key === 'Escape') { this._dismissPopup(); return; }\n      if (e.key === 'Tab') {\n        const card = document.querySelector('[data-vt-popup]');\n        if (!card) return;\n        const els = card.querySelectorAll('a[href], button, input');\n        if (!els.length) return;\n        const first = els[0], last = els[els.length - 1];\n        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }\n        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }\n      }\n    });\n    const isMobile = window.matchMedia('(max-width: 760px)').matches || 'ontouchstart' in window;\n    if (!isMobile) {\n      // exit-intent always re-prompts unless they submitted or started onboarding\n      on(document, 'mouseout', (e) => {\n        if (!e.relatedTarget && e.clientY <= 0 && !this._leadDone()) this._openPopup(true);\n      });\n      // also show after 20s on desktop\n      const t = setTimeout(() => this._openPopup(), 20000);\n      this._popupCleanups.push(() => clearTimeout(t));\n      // and once scrolled past the second section (fires once per visit, ignores 7-day rule)\n      on(window, 'scroll', () => {\n        const sec = document.querySelectorAll('section')[1];\n        if (sec && window.scrollY > sec.offsetTop + sec.offsetHeight && !this._scrollFired && !this._leadDone()) {\n          this._scrollFired = true;\n          this._openPopup(true);\n        }\n      }, { passive: true });\n    } else {\n      // 60s idle\n      let idleTimer;\n      const resetIdle = () => { clearTimeout(idleTimer); idleTimer = setTimeout(() => this._openPopup(), 20000); };\n      ['touchstart', 'scroll', 'click', 'keydown'].forEach(ev => on(window, ev, resetIdle, { passive: true }));\n      resetIdle();\n      this._popupCleanups.push(() => clearTimeout(idleTimer));\n      // fast upward scroll after 50% depth (leave signal) + scroll past second section\n      let lastY = window.scrollY, lastT = Date.now(), passedHalf = false;\n      on(window, 'scroll', () => {\n        const y = window.scrollY, t = Date.now();\n        const depth = (y + window.innerHeight) / document.documentElement.scrollHeight;\n        if (depth > 0.5) passedHalf = true;\n        const dt = t - lastT;\n        if (passedHalf && dt > 0 && dt < 400 && lastY - y > 250 && !this._leadDone()) this._openPopup(true);\n        const sec = document.querySelectorAll('section')[1];\n        if (sec && y > sec.offsetTop + sec.offsetHeight && !this._scrollFired && !this._leadDone()) {\n          this._scrollFired = true;\n          this._openPopup(true);\n        }\n        lastY = y; lastT = t;\n      }, { passive: true });\n      // leaving the page (tab switch / back) — re-eligible on return\n      on(document, 'visibilitychange', () => {\n        if (document.visibilityState === 'visible' && !this._leadDone() && !this._popupShown) this._openPopup();\n      });\n    }\n  }\n\n  _dismissPopup() {\n    this._markSeen();\n    this._popupShown = false; // allow re-trigger on a later exit if they didn't submit or start onboarding\n    this.setState({ popupState: 'closed' });\n  }\n\n  _leadDone() {\n    try { return !!(localStorage.getItem('vetiva_cta_clicked') || this.state.popupState === 'done'); } catch (e) { return false; }\n  }\n\n  _normalizePhone(raw) {\n    const p = (raw || '').replace(/[\\s\\-()]/g, '');\n    if (/^0\\d{10}$/.test(p)) return '+234' + p.slice(1);\n    if (/^\\+234\\d{10}$/.test(p)) return p;\n    return null;\n  }\n\n  _submitLead() {\n    const LEAD_ENDPOINT = 'https://REPLACE-WITH-REAL-ENDPOINT.example.com/leads';\n    const email = (this.state.popupEmail || '').trim();\n    const phone = this._normalizePhone(this.state.popupPhone);\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) { this.setState({ popupError: 'Please enter a valid email address.' }); return; }\n    if (!phone) { this.setState({ popupError: 'Please enter a valid phone number (0XXXXXXXXXX or +234XXXXXXXXX).' }); return; }\n    const lead = { email, phone, source: 'landing_exit', timestamp: new Date().toISOString() };\n    fetch(LEAD_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(lead) })\n      .catch(() => {\n        try {\n          const pending = JSON.parse(localStorage.getItem('vetiva_pending_leads') || '[]');\n          pending.push(lead);\n          localStorage.setItem('vetiva_pending_leads', JSON.stringify(pending));\n        } catch (e) {}\n      });\n    try { if (typeof fbq === 'function') fbq('trackCustom', 'LeadCaptured', { source: 'landing_exit' }); } catch (e) {}\n    this._markSeen();\n    this.setState({ popupState: 'done', popupError: '' });\n  }\n\n  R(id, fallback) { return (window.__resources && window.__resources[id]) || fallback; }\n\n  navBtn(enabled) {\n    return \"width:40px; height:40px; border-radius:50%; border:1.5px solid \" + (enabled ? \"var(--brand)\" : \"var(--line)\") + \"; background:var(--paper); color:\" + (enabled ? \"var(--brand)\" : \"var(--line)\") + \"; font-size:16px; cursor:\" + (enabled ? \"pointer\" : \"default\") + \"; display:flex; align-items:center; justify-content:center; transition:all .2s;\";\n  }\n\n  seg(active) {\n    const base = \"flex:1; display:flex; align-items:center; justify-content:center; gap:8px; font-family:var(--fb); font-weight:700; font-size:15px; padding:14px 10px; border-radius:10px; border:0; cursor:pointer; transition:all .15s ease;\";\n    return active\n      ? base + \" background:#fff; color:var(--brand); box-shadow:0 4px 12px -4px rgba(35,37,27,0.25);\"\n      : base + \" background:transparent; color:var(--green-dark);\";\n  }\n\n  renderVals() {\n    const sub = this.state.subType;\n    const allDeals = [\n        { logo: this.R(\"logoNB\", \"assets/logos/nigerian-breweries.jpeg\"), name: \"Nigerian Breweries — Rights Issue\", amount: \"₦548.8 Billion\", role: \"Financial Adviser / Lead Issuing House\", year: \"2024\" },\n        { logo: this.R(\"logoUBA\", \"assets/logos/uba.png\"), name: \"UBA — Rights Issue\", amount: \"₦239.4 Billion\", role: \"Lead Issuing House\", year: \"2024\" },\n        { logo: this.R(\"logoGTCO\", \"assets/logos/gtco.png\"), name: \"GTCO — Offer for Subscription\", amount: \"₦209.4 Billion\", role: \"Joint Issuing House\", year: \"2024\" },\n        { logo: this.R(\"logoTP\", \"assets/logos/transcorp-power.png\"), name: \"Transcorp Power — Listing by Introduction\", amount: \"₦1.8 Trillion\", role: \"Joint Financial Adviser\", year: \"2024\" },\n        { logo: this.R(\"logoMOFI\", \"assets/logos/mofi.jpeg\"), name: \"MOFI Real Estate Investment Fund\", amount: \"₦250 Billion\", role: \"Lead Issuing House\", year: \"2025\" },\n        { logo: this.R(\"logoMTN\", \"assets/logos/mtn.png\"), name: \"MTN Nigeria — Offer for Sale\", amount: \"₦111.8 Billion\", role: \"Issuing House / Bookrunner\", year: \"2021\" },\n        { logo: this.R(\"logoDC\", \"assets/logos/dangote-cement.jpeg\"), name: \"Dangote Cement — Share Buyback\", amount: \"₦41 Billion\", role: \"Lead Financial Adviser\", year: \"2023\" }\n    ];\n    const page = this.state.dealPage;\n    return {\n      dealsPage1: allDeals.slice(0, 4),\n      dealsPage2: allDeals.slice(4, 8),\n      dealTrack: \"translateX(-\" + (page * 100) + \"%)\",\n      dot1: page === 0 ? \"var(--gold)\" : \"var(--line)\",\n      dot2: page === 1 ? \"var(--gold)\" : \"var(--line)\",\n      dealPrev: () => { clearInterval(this._dealTimer); this.setState({ dealPage: 0 }); },\n      dealNext: () => { clearInterval(this._dealTimer); this.setState({ dealPage: 1 }); },\n      dealPrevStyle: this.navBtn(page === 1),\n      dealNextStyle: this.navBtn(page === 0),\n      ctaHref: this.props.ctaHref ?? \"https://client.vetiva.com/\",\n      loginHref: this.props.loginHref ?? \"https://client.vetiva.com/\",\n      showStickyCta: this.props.showStickyCta ?? true,\n      continueLabel: \"Continue as \" + sub,\n      popupOpen: this.state.popupState !== 'closed',\n      popupFormVisible: this.state.popupState === 'form',\n      popupDoneVisible: this.state.popupState === 'done',\n      popupEmail: this.state.popupEmail,\n      popupPhone: this.state.popupPhone,\n      popupError: !!this.state.popupError,\n      popupErrorText: this.state.popupError,\n      popupSetEmail: (e) => this.setState({ popupEmail: e.target.value, popupError: '' }),\n      popupSetPhone: (e) => this.setState({ popupPhone: e.target.value, popupError: '' }),\n      popupDismiss: () => this._dismissPopup(),\n      popupReopen: () => this.setState({ popupState: 'form' }),\n      popupStop: (e) => e.stopPropagation(),\n      popupSubmit: () => this._submitLead(),\n      popupCtaClick: () => { try { localStorage.setItem('vetiva_cta_clicked', '1'); } catch (e) {} this._markSeen(); this.setState({ popupState: 'closed' }); },\n      segIndividual: this.seg(sub === 'Individual'),\n      segCorporate: this.seg(sub === 'Corporate'),\n      pickIndividual: () => this.setState({ subType: 'Individual' }),\n      pickCorporate: () => this.setState({ subType: 'Corporate' }),\n\n\n      faqs: [\n        { q: \"Can someone use my BVN to take money from my account?\", a: \"No. A BVN is a Central Bank identity number — like your fingerprint, not your key. Moving money requires your card, PIN, OTP, or banking password, none of which we ever ask for. Nobody, including Vetiva, can debit your account with a BVN alone.\" },\n        { q: \"Why can't I invest without giving my BVN?\", a: \"Shares in Nigeria are held at the CSCS in the owner's name, and the SEC and CSCS require a BVN to open that account. It protects you: it's how the system guarantees the shares belong to you and not someone with a similar name. Every licensed broker has the same requirement.\" },\n        { q: \"What exactly does Vetiva do with my BVN?\", a: \"One thing: verify that you are you, and open your CSCS account. It's encrypted in transit and at rest, handled under the Nigeria Data Protection Act, never sold, and never shared for marketing.\" },\n        { q: \"What if I start signing up and change my mind?\", a: \"You can stop at any point and nothing happens — no account is created and no charge is made. Under the NDPA you can also ask us to delete the details you entered.\" },\n        { q: \"How do I know Vetiva is a real, licensed firm?\", a: \"Check independently: Vetiva's entities are on the SEC's register of capital market operators, and Vetiva Securities is a trading license holder of the NGX. The links in the section above take you to the regulators' own websites — not ours.\" }\n      ].map((f, i) => {\n        const open = this.state.openFaq === i;\n        return {\n          ...f,\n          toggle: () => this.setState({ openFaq: open ? -1 : i }),\n          iconStyle: \"flex-shrink:0; width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--green-soft); color:var(--green-dark); font-size:18px; font-weight:400; transition:transform .2s ease;\" + (open ? \" transform:rotate(45deg);\" : \"\"),\n          aStyle: open ? \"display:block;\" : \"display:none;\"\n        };\n      }),\n      record: [\n        { no: \"01\", label: \"Years as a Nigerian investment bank\", value: \"20+\" },\n        { no: \"02\", label: \"SEC-regulated Vetiva entities\", value: \"4\" },\n        { no: \"03\", label: \"Public offers & rights issues advised*\", value: \"—*\" },\n        { no: \"04\", label: \"Retail investors onboarded to the platform*\", value: \"120,000*\" },\n        { no: \"05\", label: \"Shares held in your name at\", value: \"CSCS\" }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
